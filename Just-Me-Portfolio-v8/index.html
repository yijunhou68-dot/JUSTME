function number(value) { return String(value).padStart(2,'0'); }
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function figure(file, caption, options = {}) {
  const [width,height] = imageSizes[file];
  const alt = options.alt || caption;
  const source = assetURL(file);
  const variant = [height / width > 2.05 ? 'tall' : '', options.qr ? 'qr-image' : ''].filter(Boolean).join(' ');
  return '<figure class="fig ' + (options.className || '') + '"><button type="button" class="' + variant +
    '" aria-label="放大' + escapeHTML(alt) + '" data-photo="' + file + '"><img src="' + source + '" alt="' +
    escapeHTML(alt) + '" width="' + width + '" height="' + height + '" decoding="async" loading="lazy"></button>' +
    (caption ? '<figcaption>' + escapeHTML(caption) + '</figcaption>' : '') + '</figure>';
}
function pills(labels) {
  return '<ul class="pills">' + labels.map(label => '<li>' + escapeHTML(label) + '</li>').join('') + '</ul>';
}
function timeline() {
  return '<ol class="timeline">' + experience.map(([date,title,summary]) =>

function metrics(values) {

}

      animate(element,[{opacity:0,transform:'translateY(13px)'},{opacity:1,transform:'none'}],520,{delay,fill:'backwards'});
    }
    delays = 0;
  },{root:scroll,threshold:0});
  for (const element of parts) {
    element.style.opacity = '0';
    element.addEventListener('focusin',() => {
      element.style.opacity = '';
      revealObserver?.unobserve(element);
    },{once:true});
    revealObserver.observe(element);
  }
}
async function openPage(index,trigger) {
  if (phase !== 'desk') return;
  phase = 'pulling';
  returnFocus = trigger.closest('button') || sheets[index].shortcut;
  velocityX = 0; velocityY = 0;
  setHover(-1);
  if (!open) {
    setOpen(true);
    await sleep(640);
    if (phase !== 'pulling') return;
  }
  // Keep the extracted paper facing the reader when a shortcut is used from the back.
  if (Math.cos(radians(viewY)) < .48 || Math.abs(viewX - initial.x) > 35) {
    reset();
    await sleep(350);
    if (phase !== 'pulling') return;
  }
  pulled = index;
  requestTick();
  await sleep(375);
  if (phase !== 'pulling') return;
  playSound('paper');
  const source = sheets[index].sheet.getBoundingClientRect();
  renderPage(index);
  readerDialog.showModal();
  document.documentElement.classList.add('reading');
  $('put-back').focus({preventScroll:true});
  scroll.scrollTop = 0;
  phase = 'reading';
  requestTick();
  const expand = animate(reader,[{clipPath:readerClip(source)},{clipPath:fullClip}],760);
  const shade = animate($('reader-scrim'),[{opacity:0},{opacity:1}],760);
  revealContent();
  await Promise.all([expand,shade]);
}
async function closePage() {
  if (phase === 'pulling') {
    phase = 'desk'; pulled = -1; setOpen(false); requestTick(); return;
  }
  if (phase === 'turning') { closeAfterTurn = true; return; }
  if (phase !== 'reading') return;
  phase = 'closing';
  playSound('paper');
  const source = sheets[page].sheet.getBoundingClientRect();
  const clip = getComputedStyle(reader).clipPath;
  const shade = getComputedStyle($('reader-scrim')).opacity;
  reader.getAnimations().forEach(animation => animation.cancel());
  $('reader-scrim').getAnimations().forEach(animation => animation.cancel());
  await Promise.all([
    animate(reader,[{clipPath:clip === 'none' ? fullClip : clip},{clipPath:readerClip(source)}],560,{fill:'forwards'}),
    animate($('reader-scrim'),[{opacity:Number(shade)},{opacity:0}],560,{fill:'forwards'})
  ]);
  readerDialog.close();
  document.documentElement.classList.remove('reading');
  reader.getAnimations().forEach(animation => animation.cancel());
  $('reader-scrim').getAnimations().forEach(animation => animation.cancel());
  revealObserver?.disconnect();
  content.replaceChildren();
  pulled = -1; page = -1; phase = 'desk';
  returnFocus?.focus({preventScroll:true});
  setHover(-1);
  requestTick();
}
async function turn(direction) {
  if (phase !== 'reading' || lightbox.open) return;
  phase = 'turning';
  playSound('turn');
  const fromFooter = content.contains(document.activeElement);
  const next = (page + direction + sections.length) % sections.length;
  pulled = next;
  requestTick();
  await animate(content,[{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(' + (-28 * direction) + 'px)'}],220);
  renderPage(next);
  if (fromFooter) scroll.focus({preventScroll:true});
  await animate(content,[{opacity:0,transform:'translateX(' + (34 * direction) + 'px)'},{opacity:1,transform:'none'}],520);
  phase = 'reading';
  if (closeAfterTurn) { closeAfterTurn = false; closePage(); }
}
async function copyText(value,label,button) {
  const status = content.querySelector('.copy-status');
  try {
    if (!navigator.clipboard) throw new Error('Clipboard API unavailable');
    await navigator.clipboard.writeText(value);
    status.textContent = '已复制' + label;
    markCopied(button);
  } catch {
    const field = document.createElement('textarea');
    field.value = value;
    field.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none';
    reader.append(field);
    const focused = document.activeElement;
    field.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch { /* Keep the address visible. */ }
    field.remove();
    focused?.focus({preventScroll:true});
    status.textContent = copied ? '已复制' + label : '可手动复制' + label + ' ' + value;
    if (copied) markCopied(button);
  }
}
function markCopied(button) {
  button.textContent = '已复制';
  clearTimeout(copyTimers.get(button));
  copyTimers.set(button,setTimeout(() => { button.textContent = button.dataset.copyText; },1800));
}
const copyTimers = new WeakMap();
readerDialog.addEventListener('click',event => {
  const direction = event.target.closest('[data-turn]');
  const photo = event.target.closest('[data-photo]');
  const copy = event.target.closest('[data-copy]');
  const local = event.target.closest('a[href^="#"]');
  if (local) {
    event.preventDefault();
    const destination = $(local.getAttribute('href').slice(1));
    if (destination) {
      destination.tabIndex = -1;
      destination.focus({preventScroll:true});
      destination.scrollIntoView({block:'start'});
    }
  } else if (direction) turn(Number(direction.dataset.turn));
  else if (photo) openPhoto(photo);
  else if (copy) {
    copy.dataset.copyText ||= copy.textContent;
    copyText(copy.dataset.copy,copy.dataset.copyLabel,copy);
  }
  else if (event.target === $('reader-scrim') || event.target.closest('#put-back')) closePage();
});
readerDialog.addEventListener('cancel',event => { event.preventDefault(); closePage(); });
lightbox.addEventListener('cancel',event => { event.preventDefault(); closePhoto(); });
document.addEventListener('keydown',event => {
  if (event.defaultPrevented || lightbox.open) return;
  if (readerDialog.open && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
    event.preventDefault();
    turn(event.key === 'ArrowLeft' ? -1 : 1);
  } else if (event.key === 'Escape' && !readerDialog.open) {
    if (phase === 'pulling') closePage();
    else if (phase === 'desk') setOpen(false);
  } else if (phase === 'desk' && !event.repeat && !event.ctrlKey && !event.altKey && !event.metaKey) {
    if (/^[1-8]$/.test(event.key)) {
      event.preventDefault();
      const index = Number(event.key) - 1;
      openPage(index,sheets[index].shortcut);
    } else if (event.key === 'Home') {
      event.preventDefault();
      reset();
    }
  }
});

function photoTransform(source,destination) {
  return 'translate(' + (source.left - destination.left) + 'px,' + (source.top - destination.top) + 'px) scale(' +
    (source.width / destination.width) + ',' + (source.height / destination.height) + ')';
}
async function openPhoto(trigger) {
  if (phase !== 'reading' || lightbox.open) return;
  const original = trigger.querySelector('img');
  if (!original.complete || !original.naturalWidth) {
    try { await original.decode(); } catch { return; }
    if (phase !== 'reading' || lightbox.open || !trigger.isConnected) return;
  }
  const photo = new Image();
  photo.alt = original.alt;
  trigger.setAttribute('aria-busy','true');
  photo.src = assetURL(trigger.dataset.photo,true);
  try {
    await photo.decode();
  } catch {
    photo.src = original.currentSrc || original.src;
    try { await photo.decode(); } catch { return; }
  } finally {
    trigger.removeAttribute('aria-busy');
  }
  if (phase !== 'reading' || lightbox.open || !trigger.isConnected) return;
  const box = original.getBoundingClientRect();
  const padding = innerWidth <= 650 ? 24 : 56;
  const width = Math.min(photo.naturalWidth,innerWidth - padding);
  const ratio = photo.naturalHeight / photo.naturalWidth;
  const tall = width * ratio > innerHeight * 1.6;
  const fitWidth = tall ? width : Math.min(width,(innerHeight - padding) / ratio);
  photo.style.width = fitWidth + 'px';
  photo.style.transformOrigin = '0 0';
  lightScroll.replaceChildren(photo);
  lightbox.showModal();
  lightScroll.scrollTop = 0;
  $('light-close').focus({preventScroll:true});
  const target = photo.getBoundingClientRect();
  currentPhoto = {trigger,photo,fitWidth,animation:photo.animate([{transform:photoTransform(box,target)},{transform:'none'}],{duration:duration(620),easing:ease})};
  animate($('light-scrim'),[{opacity:0},{opacity:1}],620);
}
async function closePhoto() {
  if (!currentPhoto || lightClosing) return;
  lightClosing = true;
  const {trigger,photo,animation} = currentPhoto;
  const current = photo.getBoundingClientRect();
  animation.cancel();
  lightZoom.setAttribute('aria-pressed','false');
  lightZoom.textContent = '放大阅读';
  delete lightScroll.dataset.zoomed;
  const target = photo.getBoundingClientRect();
  const source = trigger.querySelector('img').getBoundingClientRect();
  await Promise.all([
    animate(photo,[{transform:photoTransform(current,target)},{transform:photoTransform(source,target)}],620,{fill:'forwards'}),
    animate($('light-scrim'),[{opacity:1},{opacity:0}],620,{fill:'forwards'})
  ]);
  lightbox.close();
  lightScroll.replaceChildren();
  $('light-scrim').getAnimations().forEach(item => item.cancel());
  trigger.focus({preventScroll:true});
  currentPhoto = null; lightClosing = false;
}
lightZoom.addEventListener('click', () => {
  if (!currentPhoto || lightClosing) return;
  const {photo,fitWidth,animation} = currentPhoto;
  const zoomed = lightScroll.hasAttribute('data-zoomed');
  animation.cancel();
  lightScroll.toggleAttribute('data-zoomed', !zoomed);
  lightZoom.setAttribute('aria-pressed', String(!zoomed));
  lightZoom.textContent = zoomed ? '放大阅读' : '适合窗口';
  photo.style.width = (zoomed ? fitWidth : Math.min(photo.naturalWidth, Math.max(880, Math.ceil(fitWidth * 1.6)))) + 'px';
  lightScroll.scrollTo(0, 0);
});
let lightPointer;
lightbox.addEventListener('pointerdown',event => { lightPointer = [event.clientX,event.clientY]; });
lightbox.addEventListener('click',event => {
  if (event.target.closest('#light-zoom') ||
      (lightScroll.hasAttribute('data-zoomed') && event.target !== $('light-close'))) return;
  if (event.target === $('light-close') || !event.detail || !lightPointer || Math.hypot(event.clientX - lightPointer[0],event.clientY - lightPointer[1]) < 8) closePhoto();
});

new ResizeObserver(fit).observe(stage);
function updateMotion() {
  velocityX = 0; velocityY = 0;
  requestTick();
}
motion.addEventListener('change',updateMotion);
lightweight.addEventListener('change',updateMotion);
document.addEventListener('visibilitychange',() => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    raf = 0;
  } else {
    lastTime = performance.now();
    requestTick();
  }
});
fit();
requestTick();
if (!instantPose()) {
  animate($('entry'),[{transform:'translateY(70px)'},{transform:'translateY(0)'}],1200);
  sheets.forEach(({rise},i) => {
    rise.animate([{translate:'0 80px'},{translate:'0 0'}],
      {duration:duration(900),delay:duration(65*i),easing:ease,fill:'backwards'});
  });
}
</script>
